[project]
name = "translate-project"
version = "0.1.0"
description = "Day 8 NLLB translation service with FastAPI, Streamlit, and Google OAuth"
# PyTorch 2.6.0 + CUDA 12.6 wheels are available through Python 3.12.
# Pinning this prevents uv from attempting to resolve unsupported CPython 3.13 wheels.
requires-python = ">=3.10,<3.13"
dependencies = [
  "Authlib>=1.3.2,<2",
  "accelerate>=1,<2",
  "fastapi>=0.115,<1",
  "google-auth>=2,<3",
  "hf-xet>=1,<2",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "requests>=2.31,<3",
  "streamlit>=1.42,<2",
  "torch==2.6.0+cu126",
  # NLLB's translation pipeline and examples target Transformers v4.
  "transformers==4.57.3",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "ipykernel>=6,<7",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

# This project is developed and demonstrated on Windows with an NVIDIA GPU.
# Restrict resolution to that supported target so uv does not solve an irrelevant
# "other operating system" branch for the CUDA-only wheel index.
[tool.uv]
environments = ["sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
